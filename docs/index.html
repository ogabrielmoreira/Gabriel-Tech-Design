<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabriel Moreira — Designer Engineer</title>
<meta name="description" content="Gabriel Moreira · Gabriel Tech Design. Portfólio, currículo, projetos e contato.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="Gabriel Moreira — Designer Engineer">
<meta property="og:image" content="assets/gabriel.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --card:#141416; --card-2:#1a1a1d; --line:rgba(255,255,255,.08);
  --ink:#f5f5f2; --mute:#9b9b95; --y:#fbbc04; --y-deep:#e5a800;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Geist',system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(900px 500px at 50% -10%,rgba(251,188,4,.10),transparent 60%),var(--bg);
  min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{width:100%;max-width:460px;position:relative;padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* ---------- language toggle ---------- */
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5;display:flex;padding:3px;border-radius:999px;
  background:rgba(11,11,12,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.lang button{all:unset;cursor:pointer;font:600 11px/1 'Poppins';letter-spacing:.08em;padding:8px 12px;border-radius:999px;color:var(--mute);transition:.3s var(--ease)}
.lang button[aria-pressed=true]{background:var(--y);color:#111}
.lang button:focus-visible{outline:2px solid var(--y);outline-offset:2px}

/* ---------- hero ---------- */
.stage{position:relative}
.hero{position:relative;height:min(112vw,520px);overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 62%,transparent 100%);mask-image:linear-gradient(#000 62%,transparent 100%)}
.hero img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 18%;
  transform-origin:60% 30%;animation:kb 18s ease-in-out infinite alternate, fadein 1.4s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(11,11,12,.55),transparent 55%),
  linear-gradient(to top,var(--bg) 4%,rgba(11,11,12,.0) 55%)}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
@keyframes fadein{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}

.brand{position:absolute;left:18px;bottom:0;z-index:3;display:flex;align-items:center;animation:rise .9s .35s var(--ease) both}
.brand img{height:104px;width:auto;margin-left:-14px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}

.status{position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top));z-index:3;display:flex;align-items:center;gap:8px;
  font:500 12px/1 'Geist';padding:8px 12px;border-radius:999px;background:rgba(11,11,12,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);animation:rise .9s .5s var(--ease) both}
.dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

/* ---------- intro ---------- */
.intro{padding:0 22px;margin-top:-6px;text-align:left}
.intro h1{font:700 26px/1.15 'Poppins';letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--y)}
.intro p{margin-top:10px;color:var(--mute);font-size:15px;line-height:1.55;max-width:38ch}

.icons{display:flex;gap:10px;padding:20px 22px 6px}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:21px;background:var(--card);border:1px solid var(--line);
  transition:transform .35s var(--ease),background .3s,color .3s,border-color .3s}
.ico:hover,.ico:focus-visible{transform:translateY(-4px);background:var(--y);color:#111;border-color:var(--y);outline:none}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);overflow:hidden;
  transition:transform .4s var(--ease),border-color .3s,background .3s;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(260px 120px at var(--mx,100%) var(--my,0%),rgba(251,188,4,.14),transparent 70%);opacity:0;transition:opacity .4s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:rgba(251,188,4,.4);outline:none}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card:active{transform:scale(.985)}
.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--card-2);border:1px solid var(--line);color:var(--y);transition:.4s var(--ease)}
.card:hover .badge{background:var(--y);color:#111;transform:rotate(-6deg) scale(1.05)}
.txt{flex:1;min-width:0}
.txt b{display:block;font:600 12px/1 'Poppins';letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.txt span{display:block;font-size:14px;line-height:1.45;color:var(--mute)}
.arrow{font-size:18px;color:var(--mute);transition:.4s var(--ease)}
.card:hover .arrow{color:var(--y);transform:translateX(4px)}

/* primary WhatsApp */
.card.primary{background:linear-gradient(135deg,var(--y),var(--y-deep));color:#111;border-color:transparent;padding:18px 16px;animation:rise .8s var(--ease) forwards,glow 2.6s 1.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*80ms + 550ms),1.6s}
.card.primary .badge{background:#111;color:var(--y);border-color:transparent}
.card.primary:hover .badge{background:#111;color:var(--y)}
.card.primary .txt span,.card.primary .arrow{color:rgba(0,0,0,.72)}
.card.primary:hover .arrow{color:#111}
.card.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 3.6s 1.2s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:140%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(251,188,4,.45),0 10px 30px -10px rgba(251,188,4,.35)}50%{box-shadow:0 0 0 10px rgba(251,188,4,0),0 14px 40px -10px rgba(251,188,4,.55)}}

.card.pending{opacity:.55;cursor:default}
.card.pending .arrow{display:none}
.card.pending .txt b::after{content:attr(data-soon);margin-left:8px;font:500 9px/1 'Geist';letter-spacing:.08em;padding:3px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);vertical-align:2px;white-space:nowrap}

.otto .badge{padding:0}
.section-label{font:500 11px/1 'Geist';letter-spacing:.18em;text-transform:uppercase;color:var(--mute);padding:14px 6px 0}

footer{margin-top:30px;padding:0 16px;text-align:center;font-size:11px;color:var(--mute);letter-spacing:.02em}
footer i{color:var(--y);font-style:normal}

/* ---------- reveal ---------- */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.r{opacity:0;animation:rise .8s var(--ease) forwards;animation-delay:calc(var(--i,0)*80ms + 550ms)}

@media (min-width:600px){
  body{align-items:flex-start;padding:28px 0}
  .wrap{border-radius:36px;border:1px solid var(--line);overflow:hidden;background:var(--bg);box-shadow:0 40px 120px -30px rgba(251,188,4,.18)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .r{opacity:1}
}
</style>
</head>
<body>

    <a class="ico" href="https://www.google.com/maps/search/?api=1&query=S%C3%A3o+Paulo+SP" target="_blank" rel="noopener" aria-label="São Paulo"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></a>

  <footer class="r" style="--i:13">© 2026 Gabriel Moreira · Gabriel Tech Design <i>●</i> <span data-t="rights"></span></footer>
</main>

<script>
// ===== Preencha quando tiver os links =====
const CALENDLY_URL = "";   // ex.: "https://calendly.com/seu-usuario/30min"
const GOOGLE_REVIEW_URL = "https://share.google/7VUSRWGUiRs68uadS"; // link de recomendação do Google Meu Negócio

const I18N = {
  pt:{
    status:"Disponível para novos projetos",
    h1:"Design que <em>funciona</em>,<br>código que entrega.",
    sub:"Sou o Gabriel. Desenho e construo produtos digitais do conceito ao deploy. Vamos tirar sua ideia do papel?",
    wa_t:"Conversar no WhatsApp", wa_d:"Tem um projeto em mente? Me chama e vamos pedir um orçamento sem compromisso.",
    wa_msg:"Oi Gabriel! Vi seu link da bio e queria conversar sobre um projeto.",
    cal_t:"Agendar um bate-papo", cal_d:"Escolha um horário e vamos conversar sobre sua ideia, sem pressa.",
    s_work:"Trabalho", s_more:"Mais",
    port_t:"Portfólio", port_d:"Projetos, estudos de caso e o que ando construindo.",
    otto_t:"Case OTTO Vigilant", otto_d:"Veja o projeto do Otto completo: IA, segurança e HMI.",
    cv_t:"Currículo", cv_d:"Quer baixar meu currículo completo? Acesse aqui (PT e EN).",
    rev_t:"Recomendação", rev_d:"Trabalhamos juntos? Sua avaliação no Google me ajuda muito.",
    li_d:"Vamos nos conectar e trocar ideias.",
    mail_t:"E-mail", soon:"EM BREVE", rights:"Todos os direitos reservados"
  },
  en:{
    status:"Open to new projects",
    h1:"Design that <em>works</em>,<br>code that ships.",
    sub:"I'm Gabriel. I design and build digital products from concept to deploy. Ready to bring your idea to life?",
    wa_t:"Chat on WhatsApp", wa_d:"Got a project in mind? Message me and let's talk about a no-strings quote.",
    wa_msg:"Hi Gabriel! I saw your link in bio and I'd like to talk about a project.",
    cal_t:"Book a quick chat", cal_d:"Pick a time and let's talk about your idea, no rush.",
    s_work:"Work", s_more:"More",
    port_t:"Portfolio", port_d:"Projects, case studies and what I've been building.",
    otto_t:"OTTO Vigilant case", otto_d:"See the full OTTO project: AI, safety and HMI.",
    cv_t:"Résumé", cv_d:"Want my full résumé? Grab it here (PT & EN).",
    rev_t:"Recommend me", rev_d:"We've worked together? A Google review means a lot.",
    li_d:"Let's connect and swap ideas.",
    mail_t:"Email", soon:"SOON", rights:"All rights reserved"
  }
};

let lang = 'pt';
try{ lang = localStorage.getItem('lang') || (navigator.language||'pt').toLowerCase().startsWith('en') ? 'en':'pt';
     const s = localStorage.getItem('lang'); if(s) lang = s; }catch(e){ lang=(navigator.language||'').toLowerCase().startsWith('en')?'en':'pt'; }

function setLang(l){
  lang = l; const d = I18N[l];
  document.documentElement.lang = l==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = d[el.dataset.t]; if(v==null) return;
    el[el.hasAttribute('data-html')?'innerHTML':'textContent'] = v;
  });
  document.querySelectorAll('[data-soon-key]').forEach(el=>el.dataset.soon = d.soon);
  document.querySelector('[data-wa]').href = 'https://wa.me/5511947672575?text='+encodeURIComponent(d.wa_msg);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));

// links ainda pendentes
[['cal',CALENDLY_URL],['rev',GOOGLE_REVIEW_URL]].forEach(([id,url])=>{
  const a = document.getElementById(id);
  if(url){ a.href = url; } else { a.classList.add('pending'); a.removeAttribute('target'); a.addEventListener('click',e=>e.preventDefault()); }
});

// spotlight que segue o toque/mouse
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
});

setLang(lang);
</script>
</body>
